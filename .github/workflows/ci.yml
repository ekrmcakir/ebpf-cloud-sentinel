name: CI / Sensor Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Run Unit & Integration Tests
        run: |
          go test -v -race ./pkg/... ./cmd/... ./test/...

      - name: Build Sentinel Daemon and Attack Simulator
        run: |
          go build -v -o bin/ebpf-cloud-sentinel ./cmd/sentinel
          go build -v -o bin/attack-simulator ./cmd/simulator
