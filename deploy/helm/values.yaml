daemonset:
  image:
    repository: ghcr.io/ekrmcakir/ebpf-cloud-sentinel
    tag: "1.0.0"
    pullPolicy: IfNotPresent

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi

  securityContext:
    privileged: true
    capabilities:
      add:
        - BPF
        - PERFMON
        - NET_ADMIN
        - SYS_RESOURCE

metrics:
  port: 9091
  prometheus:
    enabled: true
    path: /metrics
