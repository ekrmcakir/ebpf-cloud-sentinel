apiVersion: v1
kind: ServiceAccount
metadata:
  name: ebpf-cloud-sentinel-sa
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ebpf-cloud-sentinel-role
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ebpf-cloud-sentinel-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ebpf-cloud-sentinel-role
subjects:
  - kind: ServiceAccount
    name: ebpf-cloud-sentinel-sa
    namespace: kube-system
